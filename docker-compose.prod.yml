# Eval System V2 — PRODUCTION (PostgreSQL + FastAPI + built frontend)
#
# Quick start:
#   1. cp .env.example .env           # then edit credentials
#   2. docker compose -f docker-compose.prod.yml up --build -d
#   3. Open in browser: use APP_EXTERNAL_URL from .env (see below)
#
# LAN / team access:
#   - Bind to all interfaces: ports below use 0.0.0.0 so other machines on the
#     same Wi-Fi can reach http://<host-lan-ip>:<APP_PORT>
#   - In .env set APP_EXTERNAL_URL to that full URL (e.g. http://192.168.1.108:8000)
#     so container logs and [STARTUP] show the same link you share with the team
#   - Reserve a fixed DHCP / static IP for the host so the address does not change
#   - On the server machine itself, if http://<lan-ip> fails in Safari, use
#     http://127.0.0.1:8000 (same app; some setups block “hairpin” to own LAN IP)
#
# Persistent state:
#   - pg_data       : PostgreSQL data directory
#   - eval_uploads  : Uploaded VCD / firmware / report files
#
# The app auto-creates tables on first boot via init_db() (SQLAlchemy
# create_all + idempotent ALTER TABLE migrations in db/database.py).

services:
  db:
    image: postgres:16-alpine
    container_name: eval-system-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-eval_admin}
      POSTGRES_PASSWORD: ${DB_PASS:-change_me_strong_password}
      POSTGRES_DB: ${DB_NAME:-eval_system}
    volumes:
      - pg_data:/var/lib/postgresql/data
    # Expose Postgres on the host so a native dev backend (pipenv run uvicorn)
    # can share the same DB as the Docker app — matches DB_PORT=5433 in .env.
    # Port 5433 on the host (instead of 5432) avoids colliding with a native
    # PostgreSQL that some devs already have running locally.
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-eval_admin} -d ${DB_NAME:-eval_system}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  eval:
    build: .
    image: eval-system:latest
    container_name: eval-system-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      # 0.0.0.0 = listen on all host interfaces (LAN + localhost), not 127.0.0.1 only
      - "0.0.0.0:${APP_PORT:-8000}:8000"
    environment:
      USE_SQLITE_DEMO: "0"
      DB_USER: ${DB_USER:-eval_admin}
      DB_PASS: ${DB_PASS:-change_me_strong_password}
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-eval_system}
      # Set APP_EXTERNAL_URL in .env to your LAN URL, e.g. http://192.168.1.108:8000
      # Default follows APP_PORT (host) so 127.0.0.1 matches docker compose port mapping
      APP_PORT: ${APP_PORT:-8000}
      APP_EXTERNAL_URL: ${APP_EXTERNAL_URL:-http://127.0.0.1:${APP_PORT:-8000}}
    volumes:
      - eval_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ----------------------------------------------------------------------
  # Cloudflare Quick Tunnel (optional)
  # Exposes the local stack on a public https://*.trycloudflare.com URL,
  # so teammates on a different network (or WFH) can use the app without
  # firewall / port-forwarding setup.
  #
  # Enable it explicitly:
  #   docker compose -f docker-compose.prod.yml --profile tunnel up -d
  # or:
  #   ./scripts/eval.sh tunnel
  #
  # The public URL appears in this container's logs (look for trycloudflare.com).
  # Quick Tunnel URLs change whenever this container restarts; old *.trycloudflare.com
  # hostnames stop resolving — always run `make prod-tunnel-url` again after restart.
  # ----------------------------------------------------------------------
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: eval-system-tunnel
    restart: unless-stopped
    profiles: ["tunnel"]
    depends_on:
      eval:
        condition: service_healthy
    command: tunnel --no-autoupdate --url http://eval:8000

  # ----------------------------------------------------------------------
  # pgweb — browser-based DB viewer (optional, debug only)
  # Enable with:
  #   docker compose -f docker-compose.prod.yml --profile debug up -d pgweb
  # Then open http://localhost:8081 — auto-connects to the `db` service.
  # Disable again with:
  #   docker compose -f docker-compose.prod.yml --profile debug down pgweb
  # ----------------------------------------------------------------------
  pgweb:
    image: sosedoff/pgweb:latest
    container_name: eval-system-pgweb
    restart: unless-stopped
    profiles: ["debug"]
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      DATABASE_URL: postgres://${DB_USER:-eval_admin}:${DB_PASS:-change_me_strong_password}@db:5432/${DB_NAME:-eval_system}?sslmode=disable

volumes:
  pg_data:
  eval_uploads:
