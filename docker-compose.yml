# Eval System V2 — DEMO (SQLite, single container)
# Run:   docker compose up --build -d
# Open:  http://localhost:8001
#
# For production with PostgreSQL use docker-compose.prod.yml instead.

services:
  eval:
    build: .
    image: eval-system:latest
    container_name: eval-system-demo
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      USE_SQLITE_DEMO: "1"
      SQLITE_PATH: /app/data/eval_system_demo.db
    volumes:
      - eval_data:/app/data        # SQLite DB file
      - eval_uploads:/app/uploads  # Uploaded files (VCD / firmware / etc.)
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  eval_data:
  eval_uploads:
